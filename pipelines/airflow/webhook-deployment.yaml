---
# ConfigMap for webhook listener configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pachyderm-webhook-config
  namespace: airflow
data:
  AIRFLOW_API_URL: "http://airflow-webserver.airflow:8080/api/v1"
  WEBHOOK_PORT: "8000"
  DEBUG: "false"

---
# Service for the webhook listener
apiVersion: v1
kind: Service
metadata:
  name: pachyderm-webhook
  namespace: airflow
  labels:
    app: pachyderm-webhook
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: pachyderm-webhook

---
# Deployment for the webhook listener
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pachyderm-webhook
  namespace: airflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pachyderm-webhook
  template:
    metadata:
      labels:
        app: pachyderm-webhook
    spec:
      containers:
      - name: webhook
        image: python@sha256:528257d48c1da0dcecc2e725d1ae34498d60c965f1241e39cd6a85a8859bdf84
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: AIRFLOW_API_URL
          valueFrom:
            configMapKeyRef:
              name: pachyderm-webhook-config
              key: AIRFLOW_API_URL
        - name: WEBHOOK_PORT
          valueFrom:
            configMapKeyRef:
              name: pachyderm-webhook-config
              key: WEBHOOK_PORT
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: pachyderm-webhook-config
              key: DEBUG
        command:
          - python3
          - /app/webhook_listener_stdlib.py
        volumeMounts:
        - name: webhook-code
          mountPath: /app
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 10
      volumes:
      - name: webhook-code
        configMap:
          name: webhook-listener-code
          defaultMode: 0555
