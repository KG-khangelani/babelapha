# config/airflow-gitsync.gitlab.yml
# NOTE:
# - Root .gitlab-ci.yml should define the stages, e.g.:
#     stages:
#       - airflow
#   and include this file.

airflow_validate:
  stage: airflow
  image:
    name: apache/airflow:3.1.0-python3.11
    entrypoint: [""]
  tags:
    - khancreate
  variables: &airflow_vars
    DAGS_FOLDER: "/opt/airflow/dags"
    AIRFLOW_NAMESPACE: "airflow"
    AIRFLOW_POD_LABEL: "component=scheduler"
    SOURCE_DIR: "pipelines/airflow/dags"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  rules: &airflow_rules
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - pipelines/airflow/dags/**/*
        - docker/airflow-gitsync/**/*
      when: on_success
    # Allow Web/API runs even with no diff (run automatically)
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: on_success
      allow_failure: false
    - when: never
  script:
    - python docker/airflow-gitsync/validate_dags.py

airflow_gitsync:
  stage: airflow
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  tags:
    - khancreate
  variables:
    <<: *airflow_vars
    WORKSPACE_DIR: "${CI_PROJECT_DIR}"
    BUILD_NUMBER: "${CI_PIPELINE_ID}"
    BUILD_VCS_NUMBER: "${CI_COMMIT_SHA}"
  needs:
    - job: airflow_validate
  rules: *airflow_rules
  script:
    - bash docker/airflow-gitsync/sync-to-airflow.sh
