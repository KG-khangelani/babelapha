spec:
  inputs:
    tags:
      type: array
      default:
        - "khancreate"
    dags_folder:
      type: string
      default: "/opt/airflow/dags"
    airflow_namespace:
      type: string
      default: "airflow"
    airflow_pod_label:
      type: string
      default: "component=scheduler"
    source_dir:
      type: string
      default: "pipelines/airflow/dags"
    rules_branch:
      type: string
      default: "main"
    kubeconfig_content:
      type: string
      default: ""

airflow_validate:
  stage: airflow
  image:
    name: apache/airflow:3.1.0-python3.11
    entrypoint: [""]
  tags: [[ inputs.tags ]]
  variables: &airflow_vars
    DAGS_FOLDER: "$[[ inputs.dags_folder ]]"
    AIRFLOW_NAMESPACE: "$[[ inputs.airflow_namespace ]]"
    AIRFLOW_POD_LABEL: "$[[ inputs.airflow_pod_label ]]"
    SOURCE_DIR: "$[[ inputs.source_dir ]]"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  rules: &airflow_rules
    - if: '$CI_COMMIT_BRANCH == "$[[ inputs.rules_branch ]]"'
      changes:
        - pipelines/airflow/dags/**/*
        - docker/airflow-gitsync/**/*
      when: on_success
    # Allow Web/API runs even with no diff (run automatically)
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: on_success
      allow_failure: false
    - when: never
  script:
    - python docker/airflow-gitsync/validate_dags.py

airflow_gitsync:
  stage: airflow
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  tags: [[ inputs.tags ]]
  variables:
    <<: *airflow_vars
    WORKSPACE_DIR: "${CI_PROJECT_DIR}"
    BUILD_NUMBER: "${CI_PIPELINE_ID}"
    BUILD_VCS_NUMBER: "${CI_COMMIT_SHA}"
  needs:
    - job: airflow_validate
  rules: *airflow_rules
  before_script:
    - |
      if [ -n "$[[ inputs.kubeconfig_content ]]" ]; then
        export KUBECONFIG_CONTENT="$[[ inputs.kubeconfig_content ]]"
      fi
      if [ -d "/var/run/secrets/kubernetes.io/serviceaccount" ]; then
        echo "Using in-cluster service account"
      elif [ -n "${KUBECONFIG:-}" ] && [ -f "${KUBECONFIG}" ]; then
        echo "Using KUBECONFIG file variable"
      elif [ -n "${KUBECONFIG_CONTENT:-}" ]; then
        echo "Writing KUBECONFIG_CONTENT to /tmp/kubeconfig"
        printf '%s' "${KUBECONFIG_CONTENT}" > /tmp/kubeconfig
        chmod 600 /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
      else
        echo "✗ No Kubernetes credentials found. Set KUBECONFIG (file variable) or KUBECONFIG_CONTENT."
        exit 1
      fi
  script:
    - bash docker/airflow-gitsync/sync-to-airflow.sh
