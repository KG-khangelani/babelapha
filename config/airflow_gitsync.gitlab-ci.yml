# config/airflow-gitsync.gitlab.yml

stages:
  - airflow

airflow_gitsync:
  stage: airflow
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW_NAMESPACE: airflow
    AIRFLOW_POD_LABEL: component=scheduler
    SOURCE_DIR: pipelines/airflow/dags

  # The GitLab equivalent of:
  # on:
  #   push:
  #     branches: [ main ]
  #     paths: [...]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "pipelines/airflow/dags/**/*"
        - "docker/airflow-gitsync/**/*"
      when: on_success
    - when: never

  script:
    - echo "Checkout is implicit in GitLab (repo is already in $CI_PROJECT_DIR)"
    - echo "Building validator image..."
    - >
      docker build --pull
      -f docker/airflow-gitsync/Dockerfile.validate
      -t airflow-dag-validator:${CI_PIPELINE_ID} .

    - echo "Validating DAG syntax..."
    - >
      docker run --rm
      -v "${CI_PROJECT_DIR}:/workspace"
      airflow-dag-validator:${CI_PIPELINE_ID}

    - echo "Building GitSync container..."
    - >
      docker build --pull
      -f docker/airflow-gitsync/Dockerfile
      -t airflow-gitsync:${CI_PIPELINE_ID}
      -t airflow-gitsync:latest .

    - echo "Syncing DAGs to Airflow..."
    - >
      docker run --rm
      -e WORKSPACE_DIR=/workspace
      -e BUILD_NUMBER=${CI_PIPELINE_ID}
      -e BUILD_VCS_NUMBER=${CI_COMMIT_SHA}
      -e AIRFLOW_NAMESPACE="${AIRFLOW_NAMESPACE}"
      -e KUBERNETES_SERVICE_HOST="${KUBERNETES_SERVICE_HOST}"
      -e KUBERNETES_SERVICE_PORT="${KUBERNETES_SERVICE_PORT}"
      -v /etc/resolv.conf:/etc/resolv.conf:ro
      -v "${CI_PROJECT_DIR}:/workspace:ro"
      -v /var/run/secrets/kubernetes.io/serviceaccount:/var/run/secrets/kubernetes.io/serviceaccount:ro
      airflow-gitsync:${CI_PIPELINE_ID}
