name: babelapha-local-pipeline

x-airflow-base:
  &airflow_base
  image: babelapha-airflow-local
  build:
    context: .
    dockerfile: docker/airflow-local/Dockerfile

x-airflow-env: &airflow_env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
  AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-dev-secret-key}
  AIRFLOW__API__EXPOSE_CONFIG: "false"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USERNAME:-admin}:ADMIN
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-pachyderm}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-pachyderm-secret-key-123456789}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-pachyderm}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-pachyderm-secret-key-123456789}
  AWS_DEFAULT_REGION: us-east-1
  S3_BUCKET: ${AIRFLOW_S3_BUCKET:-pachyderm}
  PROVENANCE_S3_BUCKET: ${AIRFLOW_S3_BUCKET:-pachyderm}
  PROVENANCE_S3_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  OPENLINEAGE_URL: http://marquez:5000
  OPENLINEAGE_ENDPOINT: /api/v1/lineage
  OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-babelapha.local}
  BABELAPHA_GIT_SHA: ${BABELAPHA_GIT_SHA:-}
  BABELAPHA_RUNTIME_IMAGE: ${BABELAPHA_RUNTIME_IMAGE:-babelapha-airflow-local}
  BABELAPHA_RUNTIME_IMAGE_DIGEST: ${BABELAPHA_RUNTIME_IMAGE_DIGEST:-}
  BABELAPHA_SCAN_IMAGE: ${BABELAPHA_SCAN_IMAGE:-localhost/clamav:latest}
  BABELAPHA_VALIDATE_IMAGE: ${BABELAPHA_VALIDATE_IMAGE:-localhost/validate:latest}
  BABELAPHA_TRANSCODE_IMAGE: ${BABELAPHA_TRANSCODE_IMAGE:-localhost/transcode:latest}
  AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
  AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin123}
  AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Local}
  AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Admin}
  AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@local.test}

services:
  postgres:
    image: postgres:16.15
    container_name: babelapha-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: babelapha-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pachyderm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pachyderm-secret-key-123456789}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: babelapha-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pachyderm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pachyderm-secret-key-123456789}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-pachyderm} ${MINIO_ROOT_PASSWORD:-pachyderm-secret-key-123456789}
        mc mb -p local/pachyderm
        mc version enable local/pachyderm
        mc anonymous set download local/pachyderm
    restart: "no"

  pachyderm-webhook:
    image: python:3.11.16-slim-bookworm
    container_name: babelapha-pachyderm-webhook
    depends_on:
      airflow-webserver:
        condition: service_healthy
    environment:
      AIRFLOW_API_URL: "http://airflow-webserver:8080/api/v2"
      AIRFLOW_AUTH_URL: "http://airflow-webserver:8080/auth/token"
      AIRFLOW_API_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin123}
      WEBHOOK_PORT: 8000
      AIRFLOW_DAG_ID: ${AIRFLOW_DAG_ID:-ingest_pipeline_local}
    volumes:
      - ./pipelines/airflow/webhook_listener_airflow3.py:/app/webhook_listener_airflow3.py:ro
      - ./pipelines/airflow/webhook_payload.py:/app/webhook_payload.py:ro
    command: python /app/webhook_listener_airflow3.py
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow_base
    container_name: babelapha-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow_env
    volumes:
      - airflow-home:/opt/airflow
      - ./pipelines/airflow/dags:/opt/airflow/dags
    command: >
      bash -c "
      printf '{\"%s\":\"%s\"}\n' '${AIRFLOW_ADMIN_USERNAME:-admin}' '${AIRFLOW_ADMIN_PASSWORD:-admin123}' > /opt/airflow/simple_auth_manager_passwords.json &&
      airflow db migrate &&
      true"

  airflow-webserver:
    <<: *airflow_base
    container_name: babelapha-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      marquez:
        condition: service_healthy
    environment:
      <<: *airflow_env
    volumes:
      - airflow-home:/opt/airflow
      - ./pipelines/airflow/dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: airflow api-server
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/api/v2/monitor/health || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  airflow-scheduler:
    <<: *airflow_base
    container_name: babelapha-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      marquez:
        condition: service_healthy
    environment:
      <<: *airflow_env
    volumes:
      - airflow-home:/opt/airflow
      - ./pipelines/airflow/dags:/opt/airflow/dags
    command: airflow scheduler

  airflow-dag-processor:
    <<: *airflow_base
    container_name: babelapha-airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      marquez:
        condition: service_healthy
    environment:
      <<: *airflow_env
    volumes:
      - airflow-home:/opt/airflow
      - ./pipelines/airflow/dags:/opt/airflow/dags
    command: airflow dag-processor

  provenance-inspect:
    <<: *airflow_base
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *airflow_env
    volumes:
      - ./pipelines/airflow:/workspace/pipelines/airflow:ro
    entrypoint: ["python", "/workspace/pipelines/airflow/inspect_provenance.py"]
    command: ["--help"]

  provenance-api:
    <<: *airflow_base
    container_name: babelapha-provenance-api
    depends_on:
      minio:
        condition: service_healthy
    environment:
      PROVENANCE_API_PORT: 8010
      PROVENANCE_API_OPENAPI_PATH: /workspace/contracts/provenance-read-api-v1.openapi.json
      PROVENANCE_API_ALLOWED_ORIGINS: ${PROVENANCE_API_ALLOWED_ORIGINS:-}
      PROVENANCE_S3_BUCKET: ${AIRFLOW_S3_BUCKET:-pachyderm}
      PROVENANCE_S3_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-pachyderm}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-pachyderm-secret-key-123456789}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./pipelines/airflow:/workspace/pipelines/airflow:ro
      - ./contracts:/workspace/contracts:ro
    entrypoint: ["python", "/workspace/pipelines/airflow/provenance_api.py"]
    ports:
      - "${PROVENANCE_API_HOST_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready').read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  provenance-replay:
    <<: *airflow_base
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy
      marquez:
        condition: service_healthy
    environment:
      <<: *airflow_env
    volumes:
      - ./pipelines/airflow:/workspace/pipelines/airflow:ro
    entrypoint: ["python", "/workspace/pipelines/airflow/replay_openlineage.py"]
    command: ["--help"]

  marquez-db:
    image: postgres:14.20
    container_name: babelapha-marquez-db
    environment:
      POSTGRES_USER: ${MARQUEZ_DB_USER:-marquez}
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD:-marquez}
      POSTGRES_DB: ${MARQUEZ_DB_NAME:-marquez}
    volumes:
      - marquez-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MARQUEZ_DB_USER:-marquez} -d ${MARQUEZ_DB_NAME:-marquez}"]
      interval: 5s
      timeout: 5s
      retries: 12

  marquez:
    image: marquezproject/marquez:0.51.1
    container_name: babelapha-marquez
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${MARQUEZ_DB_NAME:-marquez}
      POSTGRES_USER: ${MARQUEZ_DB_USER:-marquez}
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD:-marquez}
      SEARCH_ENABLED: "false"
    ports:
      - "5000:5000"
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    container_name: babelapha-marquez-web
    depends_on:
      marquez:
        condition: service_healthy
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
      REACT_APP_ADVANCED_SEARCH: "false"
    ports:
      - "3001:3000"

volumes:
  postgres-db:
  minio-data:
  airflow-home:
  marquez-db:
